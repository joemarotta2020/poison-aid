name: Build JM Poison SE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-se:
    name: Skyrim SE 1.5.97
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up MSVC x64
        uses: TheMrMilchmann/setup-msvc-dev@v4.0.0
        with:
          arch: x64

      - name: Prepare vcpkg
        shell: pwsh
        run: |
          C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          C:\vcpkg\vcpkg.exe version

      - name: Configure release
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

      - name: Build release
        shell: pwsh
        run: |
          cmake --build build --config Release --target JM_Poison -- /m

      - name: Verify SKSE plugin exports
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = Get-ChildItem -Path build -Recurse -File -Filter 'JM_Poison.dll' | Select-Object -First 1
          if (-not $dll) { throw 'JM_Poison.dll was not produced.' }
          $exports = (& dumpbin /nologo /exports $dll.FullName) -join "`n"
          $exports | Write-Host
          foreach ($required in @('SKSEPlugin_Load', 'SKSEPlugin_Query', 'SKSEPlugin_Version')) {
            if ($exports -notmatch [regex]::Escape($required)) {
              throw "Missing required SKSE export: $required"
            }
          }

      - name: Stage build artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path artifact\SKSE\Plugins | Out-Null

          $dll = Get-ChildItem -Path build -Recurse -File -Filter 'JM_Poison.dll' | Select-Object -First 1
          if (-not $dll) { throw 'JM_Poison.dll was not produced.' }
          Copy-Item $dll.FullName artifact\SKSE\Plugins\JM_Poison.dll

          $pdb = Get-ChildItem -Path build -Recurse -File -Filter 'JM_Poison.pdb' | Select-Object -First 1
          if ($pdb) { Copy-Item $pdb.FullName artifact\SKSE\Plugins\JM_Poison.pdb }

          Copy-Item JM_Poison.ini artifact\SKSE\Plugins\JM_Poison.ini
          "Source commit: $env:GITHUB_SHA" | Set-Content artifact\BUILD_INFO.txt
          "Runtime guard: Skyrim SE 1.5.97 only" | Add-Content artifact\BUILD_INFO.txt
          Get-ChildItem artifact -Recurse

      - name: Upload Skyrim SE build
        uses: actions/upload-artifact@v4
        with:
          name: JM_Poison-SE-1.5.97
          path: artifact/
          if-no-files-found: error
          retention-days: 30
