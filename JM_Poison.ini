; JM Poison - Pass 1
; Skyrim SE 1.5.97
;
; Formula while finite:
;   final doses = vanilla poison dose count + Alchemy bonus + best matching perk bonus
;   then clamped to MinimumDoses..MaximumFiniteDoses.
;
; Set IncludeVanillaDose=false if you want JM Poison to ignore vanilla/Ordinator
; Mod Poison Dose Count perks and use only 1 + Alchemy + Sithis.

[General]
Enabled=true
DebugNotifications=true
IncludeVanillaDose=true
MinimumDoses=1
MaximumFiniteDoses=20

; Highest threshold reached supplies the Alchemy bonus.
; Add/remove ThresholdN + BonusN pairs as desired (up to 8).
[Alchemy]
Threshold1=25
Bonus1=1
Threshold2=50
Bonus2=2
Threshold3=75
Bonus3=3
Threshold4=100
Bonus4=4

; These are the EXISTING rank-state perks in JM_Sithis_Overhaul.esp.
; Sithis currently keeps exactly one active rank perk on the player.
; The DLL is generic: these plugin/FormID/bonus mappings can be changed here.
[Perks]
Tier1Plugin=JM_Sithis_Overhaul.esp
Tier1FormID=0x00000800
Tier1Bonus=1

Tier2Plugin=JM_Sithis_Overhaul.esp
Tier2FormID=0x00000801
Tier2Bonus=2

Tier3Plugin=JM_Sithis_Overhaul.esp
Tier3FormID=0x00000802
Tier3Bonus=3

Tier4Plugin=JM_Sithis_Overhaul.esp
Tier4FormID=0x00000803
Tier4Bonus=4

; Rank 5 is intentionally NOT listed as a finite bonus by default.
; It is the infinite-poison unlock below.

[Infinite]
Plugin=JM_Sithis_Overhaul.esp
FormID=0x00000804